
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Student Management System</h1>
        <p>Manage your student records easily</p>
    </header>

    <main class="container">
        <section class="card">
            <h2 id="formTitle">Add New Student</h2>

            <form id="studentForm">
                <input type="hidden" id="editId">

                <div class="form-grid">
                    <div class="field">
                        <label for="name">Student Name</label>
                        <input type="text" id="name"
                               placeholder="Enter full name" required>
                    </div>

                    <div class="field">
                        <label for="roll">Roll Number</label>
                        <input type="text" id="roll"
                               placeholder="e.g. BSCS-101" required>
                    </div>

                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email"
                               placeholder="student@example.com" required>
                    </div>

                    <div class="field">
                        <label for="course">Course</label>
                        <input type="text" id="course"
                               placeholder="e.g. Computer Science" required>
                    </div>

                    <div class="field">
                        <label for="semester">Semester</label>
                        <select id="semester" required>
                            <option value="">Select semester</option>
                            <option value="1">1st Semester</option>
                            <option value="2">2nd Semester</option>
                            <option value="3">3rd Semester</option>
                            <option value="4">4th Semester</option>
                            <option value="5">5th Semester</option>
                            <option value="6">6th Semester</option>
                            <option value="7">7th Semester</option>
                            <option value="8">8th Semester</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn">
                        Add Student
                    </button>
                    <button type="button" id="cancelBtn"
                            class="secondary hidden">
                        Cancel Edit
                    </button>
                </div>
            </form>
            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section class="card">
            <div class="table-heading">
                <h2>Student Records</h2>
                <span id="studentCount">0 students</span>
            </div>

            <label for="search">Search students</label>
            <input type="search" id="search"
                   placeholder="Search by name, roll, email, or course">

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Semester</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable">
                        <!-- JavaScript adds student rows here -->
                    </tbody>
                </table>
            </div>
            <p id="emptyMessage">No student records found.</p>
        </section>
    </main>

    <footer>
        <p>Student Management System | Mini Project</p>
    </footer>
</body>
</html>
